services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=128MB"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
    # The database is NOT published to the host; only the app can reach it.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      # The single password students type in on the login form.
      APP_PASSWORD: ${APP_PASSWORD:-sqlrocks}
      # Used to sign the login cookie and derive per-database role passwords.
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-secret}
    ports:
      - "${PORT:-3000}:3000"
    networks:
      - default
      - proxy_network

volumes:
  pgdata:

networks:
  proxy_network:
    external: true
