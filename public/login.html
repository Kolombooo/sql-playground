<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SQL Playground</title>
  <link rel="stylesheet" href="/tailwind.css" />
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <form id="form" class="w-full max-w-sm bg-white rounded-xl shadow-lg p-8 space-y-5">
    <div>
      <h1 class="text-2xl font-bold text-slate-800">SQL Playground</h1>
      <p class="text-sm text-slate-500 mt-1">Enter the class password and pick your database number.</p>
    </div>
    <div>
      <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
      <input id="password" type="password" required autofocus
        class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
    </div>
    <div>
      <label for="number" class="block text-sm font-medium text-slate-700 mb-1">Your number (1&ndash;50)</label>
      <input id="number" type="number" min="1" max="50" required
        class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      <p class="text-xs text-slate-500 mt-1">You get the database <code>playground&lt;number&gt;</code>. Use the same number next time to see your work again.</p>
    </div>
    <p id="error" class="hidden text-sm text-red-600"></p>
    <button class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 transition">Start</button>
  </form>
  <script>
    const form = document.getElementById("form");
    const err = document.getElementById("error");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      err.classList.add("hidden");
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          password: document.getElementById("password").value,
          number: document.getElementById("number").value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) return (location.href = "/");
      err.textContent = data.error || "Login failed.";
      err.classList.remove("hidden");
    });
  </script>
</body>
</html>
